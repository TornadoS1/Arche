name: DNS check (temporary)

on:
  push:
    branches: [ccr-bb774e25-2dypc0]
    paths: [.github/workflows/dns-check.yml]

permissions:
  contents: read
  pages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS records
        run: |
          for n in archenoahmythos.de www.archenoahmythos.de; do
            for t in A AAAA CNAME CAA NS; do
              echo "== $n $t"; dig +short "$n" "$t" @1.1.1.1
            done
          done
      - name: HTTP and certificate
        run: |
          for u in http://archenoahmythos.de http://www.archenoahmythos.de https://www.archenoahmythos.de https://archenoahmythos.de; do
            echo "== $u"; curl -sSI --max-time 15 "$u" 2>&1 | head -6 || true
          done
          echo | openssl s_client -connect www.archenoahmythos.de:443 -servername www.archenoahmythos.de 2>/dev/null | openssl x509 -noout -subject -issuer -dates || true
      - name: Pages config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/pages || true
          gh api repos/${{ github.repository }}/pages/health || true
